# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 1
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 15
shadows_blur = 15
shadows_position_x = -5
shadows_position_y = 5
shadows_color= 0x00000085

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000033

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=300
animation_duration_open=300
animation_duration_tag=150
animation_duration_close=150
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=de

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=20
gap_outer_vertical=20
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=0
root_color=0x000000ff
border_color=0x222222ff
drop_color=0x33333388
split_color=0x444444ff
focus_color=0xccccccff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
#
# Scheme (everything window-manager related lives on SUPER, so it never
# collides with application shortcuts like Alt+Left or Ctrl+Left):
#   SUPER + key              = do the thing      (focus, open, toggle)
#   SUPER + SHIFT + key      = move the thing    (move window, send to tag)
#   SUPER + CTRL + arrows    = change tag        (previous / next)
#   SUPER + ALT + arrows     = resize window
#   Vim keys (h j k l) work like the arrow keys for focus and move.

# ── Startup ─────────────────────────────────────────────────
# Runs once per session. `exec=` would re-run these on every reload_config.
# terminal server: SUPER+Return spawns footclient, which connects to this.
# note: the server parses foot.ini only once; per-shell colors are re-read by
# the client via `-o include=...` in the keybind, so wallust changes still apply.
exec_once=[ -S "$XDG_RUNTIME_DIR/foot-${WAYLAND_DISPLAY}.sock" ] || foot --server
exec_once=awww-daemon
exec_once=~/.local/bin/fuzzel-settings restore
exec_once=mangobar -c ~/.config/mango/mangobar/config.jsonc -s ~/.config/mango/mangobar/style.css
exec_once=mako
exec_once=systembus-notify
exec_once=~/.local/bin/battery-notify
exec_once=swayidle -w timeout 600 'swaylock -f' before-sleep 'swaylock -f'


# ── Session ─────────────────────────────────────────────────
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,e,quit
bind=SUPER,q,killclient,

# ── Launch ──────────────────────────────────────────────────
# footclient attaches to the `foot --server` started by exec_once above.
# The -o include= re-reads wallust colors per window (server config is cached).
bind=SUPER,Return,spawn_shell,footclient -o include=$HOME/.config/foot/colors.ini
bind=SUPER,space,spawn,fuzzel
bind=SUPER+ALT,r,spawn_shell,setsid -f sh -c 'pkill -x foot; sleep 1; foot --server' # restart foot server

# Screenshots
bind=NONE,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && notify-send -t 2000 Screenshot "Saved to ~/Pictures/Screenshots"
bind=SHIFT,Print,spawn_shell,g=$(slurp) && grim -g "$g" - | wl-copy && notify-send -t 2000 Screenshot "Region copied to clipboard"
bind=SUPER+SHIFT,s,spawn_shell,g=$(slurp) && grim -g "$g" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && notify-send -t 2000 Screenshot "Saved to ~/Pictures/Screenshots"
# slurp's fullscreen overlay (namespace "selection") would otherwise get layer
# blur, which with blur_optimized paints the blurred wallpaper over all windows.
layer_rule=no_blur:1,no_animation:1,no_shadow:1,layer_name:selection


# Screenlock
bind=SUPER,Escape,spawn,swaylock -f

# ── Focus ───────────────────────────────────────────────────
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=ALT,Tab,togglejump,

# ── Move window within the layout ───────────────────────────
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,j,move_client,down

# ── Window state ────────────────────────────────────────────
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverlay,
bind=SUPER,z,toggle_scratchpad

# ── Layouts ─────────────────────────────────────────────────
bind=SUPER,n,switch_layout

# scroller layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,r,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# dwindle layout (manual split mode)
bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction

# ── Tags (workspaces) ───────────────────────────────────────
# Super+N        = go to tag N
# Super+Shift+N  = send focused window to tag N (and follow it)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# previous / next tag, and send window to previous / next tag
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER+CTRL+SHIFT,Left,tagtoleft,0
bind=SUPER+CTRL+SHIFT,Right,tagtoright,0

# ── Monitors (uncomment if you use more than one) ───────────
# bind=SUPER+SHIFT,comma,focusmon,left
# bind=SUPER+SHIFT,period,focusmon,right
# bind=SUPER+CTRL,comma,tagmon,left
# bind=SUPER+CTRL,period,tagmon,right

# ── Gaps ────────────────────────────────────────────────────
bind=SUPER,0,togglegaps

# ── Floating windows: resize / nudge ────────────────────────
bind=SUPER+ALT,Up,resizewin,+0,-50
bind=SUPER+ALT,Down,resizewin,+0,+50
bind=SUPER+ALT,Left,resizewin,-50,+0
bind=SUPER+ALT,Right,resizewin,+50,+0

bind=SUPER+ALT+SHIFT,Up,movewin,+0,-50
bind=SUPER+ALT+SHIFT,Down,movewin,+0,+50
bind=SUPER+ALT+SHIFT,Left,movewin,-50,+0
bind=SUPER+ALT+SHIFT,Right,movewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# ── Media keys ──────────────────────────────────────────────
# "l" flag = also works while the screen is locked

# Volume (needs wpctl from WirePlumber; capped at 100%)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness (needs brightnessctl; --min-value=1 stops the screen going fully black)
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -c backlight --min-value=1 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -c backlight --min-value=1 set 5%-

# Your settings menu (spawn_shell so $HOME gets expanded)
bind=SUPER,comma,spawn_shell,$HOME/.local/bin/fuzzel-settings

# Gesture Bindings
# Live drag preview while swiping (set to 0 to act only on release)
gesture_live=1

# 3-finger: switch views (tags) and overview
gesturebind=none,left,3,viewtoright,0
gesturebind=none,right,3,viewtoleft,0
gesturebind=none,up,3,toggleoverview

