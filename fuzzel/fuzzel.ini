# ~/.config/fuzzel/fuzzel.ini — colors come from the wallpaper via wallust
# Shared by the app launcher and the settings menu.
# The [colors] section lives in colors.ini (generated from the wallust
# template ~/.config/wallust/templates/fuzzel.ini).
# Colors are RRGGBBAA (no '#').

include=~/.config/fuzzel/colors.ini

[main]
font=Terminus:size=12
use-bold=yes
prompt="> "
icons-enabled=no
width=36
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
layer=overlay
exit-on-keyboard-focus-loss=yes

[border]
width=1
radius=0
