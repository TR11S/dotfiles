# wallust template -> ~/.config/fuzzel/colors.ini
# Included from fuzzel.ini via: include=~/.config/fuzzel/colors.ini
# Colors are RRGGBBAA, no '#' (hence the 'strip' filter).
#
# Mapping (dark16 palette):
#   background   wallpaper background
#   text/input   foreground
#   prompt/match color6   -- warm accent, readable on background
#   counter      color8   -- muted
#   selection    color0   -- subtle lift off the background
#   border       color4

[colors]
background={{background | strip}}ff
text={{foreground | strip}}ff
message={{foreground | strip}}ff
prompt={{color6 | strip}}ff
placeholder={{color8 | strip}}ff
input={{foreground | strip}}ff
match={{color6 | strip}}ff
selection={{color0 | strip}}ff
selection-text={{foreground | strip}}ff
selection-match={{color6 | strip}}ff
counter={{color8 | strip}}ff
border={{color4 | strip}}ff
