# wallust template -> ~/.config/swaylock/config
# Generated on every wallpaper change; edit the template, not the output.
# Colors are RRGGBBAA, no '#' (hence the 'strip' filter).
#
# Mapping (dark16 palette):
#   ring          color4   -- same accent as the fuzzel border
#   key/verify    color6   -- warm accent
#   clear/bs      color3
#   wrong         color9
#   caps lock     color5
#   inside        background, translucent over the wallpaper

image={{wallpaper}}
scaling=fill
color={{background | strip}}ff

font=Terminess Nerd Font
font-size=22
indicator-radius=110
indicator-thickness=8
indicator-caps-lock
show-failed-attempts
ignore-empty-password
daemonize

# Normal
inside-color={{background | strip}}cc
ring-color={{color4 | strip}}ff
line-color=00000000
separator-color=00000000
text-color={{foreground | strip}}ff
key-hl-color={{color6 | strip}}ff
bs-hl-color={{color3 | strip}}ff

# Clearing
inside-clear-color={{background | strip}}cc
ring-clear-color={{color3 | strip}}ff
line-clear-color=00000000
text-clear-color={{foreground | strip}}ff

# Verifying
inside-ver-color={{background | strip}}cc
ring-ver-color={{color6 | strip}}ff
line-ver-color=00000000
text-ver-color={{foreground | strip}}ff

# Wrong
inside-wrong-color={{background | strip}}cc
ring-wrong-color={{color9 | strip}}ff
line-wrong-color=00000000
text-wrong-color={{color9 | strip}}ff

# Caps lock
inside-caps-lock-color={{background | strip}}cc
ring-caps-lock-color={{color5 | strip}}ff
line-caps-lock-color=00000000
text-caps-lock-color={{color5 | strip}}ff
caps-lock-key-hl-color={{color6 | strip}}ff
caps-lock-bs-hl-color={{color3 | strip}}ff

# Layout indicator (only shown with multiple xkb layouts)
layout-bg-color=00000000
layout-border-color=00000000
layout-text-color={{foreground | strip}}ff
